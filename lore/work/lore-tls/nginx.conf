# 社内端末が Nginx に直接接続し、Lore Server と bridge が同居する例。
# 前段に別のプロキシを置く場合は接続元 IP の扱いを再設計する。

server {
    listen 127.0.0.1:8080 ssl;
    listen 172.20.11.216:8080 ssl;
    server_name 172.20.11.216;

    # ブラウザ向け HTTPS のサーバー証明書。
    ssl_certificate /datadrive/lore/certs/lore-server.crt;
    ssl_certificate_key /datadrive/lore/certs/lore-server.key;
    # 認証 URL のクエリ文字列をアクセスログに残さない。
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # クライアント指定の同名ヘッダーを上書きする。
        proxy_set_header x-lore-client-ip $remote_addr;
    }
}

server {
    listen 127.0.0.1:8081 ssl;
    listen 172.20.11.216:8081 ssl;
    http2 on;
    server_name 172.20.11.216;

    ssl_certificate /datadrive/lore/certs/lore-server.crt;
    ssl_certificate_key /datadrive/lore/certs/lore-server.key;
    access_log off;

    # bridge に提示された証明書を CA と localhost の名前で検証する。
    grpc_ssl_trusted_certificate /datadrive/lore/certs/lore-ca.crt;
    grpc_ssl_verify on;
    grpc_ssl_server_name on;
    grpc_ssl_name localhost;

    location ^~ /ucs.auth.RebacApi/ {
        # 同一ホストの loreserver からの接続のみ。
        allow 127.0.0.1;
        allow 172.20.11.216;
        deny all;
        grpc_set_header x-lore-client-ip $remote_addr;
        grpc_pass grpcs://127.0.0.1:18081;
    }

    location / {
        grpc_set_header x-lore-client-ip $remote_addr;
        grpc_pass grpcs://127.0.0.1:18081;
    }
}
