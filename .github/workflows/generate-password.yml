name: Generate Password

on:
  workflow_call:
    inputs:
      length:
        description: 'ランダム文字列の長さ'
        required: false
        type: number
        default: 32
    outputs:
      password:
        description: '生成されたランダムな文字列'
        value: ${{ jobs.generate.outputs.password }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      password: ${{ steps.generate.outputs.password }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          repository: radicalgrimoire/radicalgrimoire
          ref: main
          path: workflow-source

      - name: ランダムな文字列を生成
        id: generate
        run: |
          PASSWORD=$(bash workflow-source/scripts/generate-password.sh "${{ inputs.length }}")
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "生成されたパスワード長: ${#PASSWORD}"